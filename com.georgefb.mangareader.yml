---
app-id: com.georgefb.mangareader
runtime: org.kde.Platform
runtime-version: 6.11
sdk: org.kde.Sdk
command: mangareader
rename-icon: mangareader
copy-icon: true
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --filesystem=host:ro
  - --filesystem=home
modules:
  - name: mangareader
    buildsystem: cmake-ninja
    post-install:
      - install -Dm644 -t /app/share/licenses/${FLATPAK_ID} LICENSES/*
    sources:
      - type: archive
        url: https://github.com/g-fb/mangareader/archive/refs/tags/2.5.2.tar.gz
        sha256: 0cf3e283c814b3caf10820038d1ece8e874c76bc56794cdad4615e783835bee4

  - name: unrar
    no-autogen: true
    make-install-args:
      - DESTDIR=/app
    sources:
      - type: archive
        url: https://www.rarlab.com/rar/unrarsrc-7.3.2.tar.gz
        sha256: f61a1160d6e2ebbda2ad353c8e82f62ab4312f97fde23c6c2c982d25e0014f99
        x-checker-data:
          type: anitya
          project-id: 13306
          url-template: https://www.rarlab.com/rar/unrarsrc-$version.tar.gz
